<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#18372f"><link rel="stylesheet" href="assets/site.css"><title>Track RFQ | MACTORY FATCH</title></head><body><header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html"><span class="brand-name">MACTORY FATCH</span><span class="brand-tag">Manufacturing connected</span></a><nav class="nav-links"><a href="/customer">For buyers</a><a href="/factoryowner">For factories</a></nav></div></header><main class="section"><div class="container" style="max-width:760px"><p class="eyebrow">Private enquiry tracker</p><h1>Your manufacturing enquiry.</h1><p class="lead">This page uses the private link sent when you submitted your RFQ. Keep the link safe.</p><div id="statusPanel" class="panel" aria-live="polite"><p>Loading enquiry…</p></div></div></main><script>
(()=>{const token=new URLSearchParams(location.hash.slice(1)).get('token'),panel=document.querySelector('#statusPanel'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));if(!token){panel.innerHTML='<h2>Missing private link</h2><p>Open the complete tracking link from your confirmation email.</p>';return}fetch('/api/rfqs/status',{method:'POST',headers:{'Content-Type':'application/json'},cache:'no-store',body:JSON.stringify({token})}).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error||'Could not load enquiry.');panel.innerHTML=`<div class="badges"><span class="pill">${esc(d.status.replaceAll('_',' '))}</span><span class="pill">${esc(d.reference)}</span></div><h2>${esc(d.product)}</h2><p><strong>Quantity:</strong> ${Number(d.quantity).toLocaleString()}<br><strong>Material:</strong> ${esc(d.material)}<br><strong>Submitted:</strong> ${esc(new Date(d.createdAt).toLocaleString())}</p><div class="notice">Status reflects the latest information saved by MACTORY FATCH. An email notification may take additional time.</div><h3>Supplier response</h3>${d.response?`<div class="output-box">${esc(d.response).replace(/\n/g,'<br>')}</div><p class="field-help">Response received ${esc(d.respondedAt?new Date(d.respondedAt).toLocaleString():'')}</p>`:'<p>The factory has not responded yet. Check this page again later.</p>'}<button class="button button-outline" id="refreshStatus" type="button">Refresh status ↻</button>`;document.querySelector('#refreshStatus').addEventListener('click',()=>location.reload());}).catch(e=>{panel.innerHTML=`<h2>Unable to load enquiry</h2><p>${esc(e.message)}</p>`;});})();
</script></body></html>
